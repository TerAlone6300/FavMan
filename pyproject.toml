[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "favman"
version = "0.1.1"
description = "A CLI tool to manage favorite directories and files"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
addfav = "favman.main:addfav"
rmfav = "favman.main:rmfav"
goto = "favman.main:goto"
addfavf = "favman.main:addfavf"
rmfavf = "favman.main:rmfavf"
execute = "favman.main:execute"
listfav = "favman.main:listfav"
